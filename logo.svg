<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0a0f0d" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bowl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="44" fill="url(#bg-grad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.35" />
  
  <!-- Outer Glow Circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.3" />

  <!-- Sun / Warmth Core -->
  <circle cx="100" cy="74" r="28" fill="url(#sun-grad)" opacity="0.9" filter="url(#glow)" />

  <!-- Sprout Stem & Leaves (SDG 2 Growth) -->
  <path d="M100,105 C100,85 100,68 100,55" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Left Leaf -->
  <path d="M100,82 C82,82 72,66 74,54 C88,54 98,68 100,82 Z" fill="url(#leaf-grad)" filter="url(#glow)" />
  
  <!-- Right Leaf -->
  <path d="M100,72 C116,72 126,58 124,46 C110,46 102,58 100,72 Z" fill="#34d399" />

  <!-- Nurturing Bowl (Food Security & Nutrition) -->
  <path d="M55,108 C55,142 145,142 145,108 Z" fill="url(#bowl-grad)" stroke="#34d399" stroke-width="2" />
  <path d="M48,108 Q100,114 152,108 Q100,102 48,108 Z" fill="#059669" />

  <!-- Small Steam / Aroma / Nutrition Lines -->
  <path d="M78,98 Q82,90 78,82" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M122,98 Q126,90 122,82" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Bottom Accent Ribbon / SDG 2 Badge -->
  <rect x="52" y="152" width="96" height="22" rx="11" fill="#111a16" stroke="#f59e0b" stroke-width="1.5" />
  <text x="100" y="167" font-family="'Outfit', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="1">SDG 2 · ZERO HUNGER</text>
</svg>
